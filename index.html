      <template id="win-about">
        <section class="os-window" data-app="about" style="left:120px; top:70px;">
          <header class="os-titlebar">
            <img src="images/oscicons/about.svg?v=1" alt="" />
            <span class="os-title pixel">about me.txt</span>
            <div class="os-wbtns"><button class="os-wbtn x" aria-label="close">x</button></div>
          </header>
          <div class="os-body">
            <div class="app-head">
              <img src="images/oscicons/kip.svg?v=1" alt="Kip" />
              <h3 class="app-title pixel">hi, i'm Mike. (Kip's human)</h3>
            </div>
            <p class="app-sub">Mike Alinghawa - I.T. student, game builder, hardware tinkerer, wind-chime enjoyer.</p>

            <div class="kip-note">
              <img src="images/oscicons/kip.svg?v=1" alt="" />
              <p><strong>Kip the mascot says:</strong> I'm a mudkip at heart. On land I'm shy and weak, in water I lock in. Mike runs the same OS.</p>
            </div>

            <div class="timeline">
              <div class="tl-item">
                <h4>pisonet era <span class="year">age 5-6</span></h4>
                <p>Ran to the computer shop with 1-3 pesos borrowed from my mother (she always knew). Falling in love with screens - brick by pixel.</p>
              </div>
              <div class="tl-item">
                <h4>the cheat engine phase <span class="year">2018-19</span></h4>
                <p>If the game wouldn't give it to me honestly, I gave it to myself. Found Python because I wanted to cheat better. Started real code, then stopped for a year - life crisis does that. I came back anyway.</p>
              </div>
              <div class="tl-item">
                <h4>the GAS detour <span class="year">senior high</span></h4>
                <p>Chose General Academic Strand because I genuinely didn't know what to do with my life. Then code waved hello again. Life corrected itself.</p>
              </div>
              <div class="tl-item">
                <h4>the nerd summoning <span class="year">now - Cebu Eastern College</span></h4>
                <p>4th year, B.S. I.T. My classmates call me a nerd. I heard "wanted" and took it as a promotion: Python, Java, C++, C#, HTML - whatever the console asks for.</p>
              </div>
              <div class="tl-item">
                <h4>the lock-in years <span class="year">2024-2026</span></h4>
                <p>Building games in Godot (beginner badge, proudly worn), tried Unity jam work, full-stack web (Django, Laravel, React), and hardware with ESP32/Arduino for FindMoSer, our capstone. I read code slowly - so I build things I can test. Competitions and small builds keep me alive.</p>
              </div>
            </div>

            <p class="mini-heading">SKILL INVENTORY // what the machine holds</p>
            <div class="chip-row">
              <span class="chip">Python</span><span class="chip">Java</span><span class="chip">C#</span>
              <span class="chip">C++</span><span class="chip">HTML/CSS</span><span class="chip">SQL</span>
              <span class="chip">PHP</span><span class="chip">Django</span><span class="chip">Laravel</span>
              <span class="chip">ASP.NET</span><span class="chip">React</span><span class="chip">PostgreSQL</span>
              <span class="chip">SQLite</span><span class="chip">Docker</span><span class="chip">Git</span>
              <span class="chip">Godot</span><span class="chip">Unity</span><span class="chip">ESP32</span>
              <span class="chip">Arduino</span><span class="chip">Mapbox SDK</span><span class="chip">REST APIs</span>
              <span class="chip">MVC</span><span class="chip">Game Dev</span><span class="chip hot">Augmented Reality</span>
              <span class="chip hot">Vibe builder</span>
            </div>

            <hr class="os-hr" />
            <p class="mini-heading">BADGES // none of these are invented. check the sources.</p>
            <div class="chip-row">
              <span class="chip badge">Top 9 - Hack4Gov 2026 (Cebu) - Team Ellipse / TungSahur</span>
              <span class="chip badge">Top 12 Grand Finalist - Sinulog PropTech Hackathon</span>
              <span class="chip badge">UPCSG Game Jam 2025 - Backend</span>
              <span class="chip badge">CTO - AWS Student Builder Group Flurry</span>
              <span class="chip badge">PSITS Core Member</span>

            <article class="proj-card">
              <div class="shot"><a href="https://lms-nexora-lime.vercel.app/" target="_blank" rel="noopener"><img src="images/games/lms-live.png?v=1" alt="Nexora LMS live login screen" /></a></div>
              <h4>Nexora LMS <span class="live-tag">LIVE</span></h4>
              <span class="role-tag">backend, realtime systems, integrations</span>
              <p>Offline-capable gamified learning platform: real-time PvP code battles with ELO matchmaking and brackets, offline AI tutor (Ollama Qwen 2.5 + Moondream), Judge0 sandbox for 40+ languages, AI quiz generator with anti-cheat, whole rig deployable on one laptop via Docker + Nginx for classroom LAN use.</p>
              <div class="proj-links">
                <a class="os-btn big" href="https://lms-nexora-lime.vercel.app/" target="_blank" rel="noopener">open the app</a>
                <a class="os-btn big" href="https://github.com/ImNew222/LMS-Nexora" target="_blank" rel="noopener">repo</a>

            </article>

            <article class="proj-card">
              <div class="shot"><a href="https://github.com/ImNew222/UniversityFInds-Cebu" target="_blank" rel="noopener"><img src="images/games/repo-university.png?v=1" alt="UniversityFinds repository" /></a></div>
              <h4>UniversityFinds - Cebu</h4>
              <p>Laravel 12 + PHP 8.2 + MySQL university discovery for Cebu City: matches students to programs across 10+ institutions, interactive 3D campus maps (Mapbox GL JS), live geolocation, terrain and routing.</p>
              <div class="proj-links"><a class="os-btn big" href="https://github.com/ImNew222/UniversityFInds-Cebu" target="_blank" rel="noopener">repo</a></div>

            <article class="proj-card">
              <div class="shot"><a href="https://play.unity.com/en/games/b06754f2-7e58-4926-8a58-1699c6e7ab88/the-waking-nightmare-v2" target="_blank" rel="noopener"><img src="images/games/unity-waking.png?v=1" alt="The Waking Nightmare V2 on Unity Play" /></a></div>

              <span class="role-tag">solo build in 24 hours</span>

              <div class="proj-links"><a class="os-btn big" href="https://play.unity.com/en/games/b06754f2-7e58-4926-8a58-1699c6e7ab88/the-waking-nightmare-v2" target="_blank" rel="noopener">play it free</a></div>

            <article class="proj-card">
              <div class="shot"><a href="https://github.com/ImNew222/PropConnect" target="_blank" rel="noopener"><img src="images/games/repo-lms.png?v=2" alt="GitHub repositories overview" /></a></div>
              <h4>PropConnect</h4>

            <article class="proj-card">
              <div class="shot"><a href="https://github.com/ImNew222" target="_blank" rel="noopener"><img src="images/oscicons/disk.svg?v=1" alt="hardware project placeholder icon" style="object-fit:contain; padding:16px; background:var(--panel-2);"/></a></div>

              <div class="proj-links"><a class="os-btn big" href="https://github.com/ImNew222" target="_blank" rel="noopener">github</a></div>

              <h4>TungSahurZone <span class="chip badge">GODOT - IN DEV</span></h4>
              <p>A pixel-art RPG zone builder project: town (hardware shop, waterfall, boats), interiors, subway boss encounters with Health / Insanity / P5H stats, rain systems, rescue events, tilemap state machines. Modern exterior tiles + real event flow (CityZone - SecondFloor - FutureZone).</p>
              <div class="game-grid">

              <div class="kip-note"><img src="images/oscicons/kip.svg?v=1" alt="" /><p>Project name inspired by the Hack4Gov team (Team Ellipse, aka TungSahur). Synergy, not coincidence: energy from one arena carried everywhere.</p></div>

            <div class="anime-card">
              <div class="anime-strip"></div>
              <div>
                <h4 class="pixel" style="font-size:1.1rem;">Violet Evergarden</h4>
                <p style="font-size:.94rem; margin:6px 0;">Episode 10, the ghostwriting arc: a mother writing fifty years of letters, to be delivered on her daughter's future birthdays. Powerful letters, hands down; it stays in the chest long after the credits. Yes, I cried. No shame, it's a proud kind of crying.</p>
                <div class="chip-row"><span class="chip">instant rewatch</span><span class="chip hot">cried = human bonus</span></div>
              </div>
            </div>

            <div class="anime-card">
              <div class="anime-strip"></div>
              <div>
                <h4 class="pixel" style="font-size:1.1rem;">K-On!</h4>
                <p style="font-size:.94rem; margin:6px 0;">Team mascot alignment: <strong>Yui</strong> (with occasional Azunyan ceremonial protocol). Cuteness as a lifestyle, cake as nutrition. If my portfolio chimes at unexpected times, blame the ho-kago tea time energy.</p>
                <div class="chip-row"><span class="chip badge">team: Yui</span><span class="chip">sometimes: Azunyan</span></div>
              </div>
            </div>

            <hr class="os-hr" />
            <p class="mini-heading">WHY ANIME IN A PORTFOLIO?</p>
            <p>Because taste drives taste. Evergarden's slow, powerful dialogue taught me pacing; K-On's middles taught me warmth. Both leak into how I code interfaces and games: intentional, funny, a little sentimental.</p>

            <div class="kip-note">

      <img src="images/oscicons/kip.svg?v=1" alt="" /><span class="pixel">Kip</span>
    </button>
    <div class="tb-chips" id="chips"></div>
    <div class="tb-right">
      <button class="tb-btn" id="musicBtn" title="music: lofi chime loop"><img src="images/oscicons/spk-on.svg?v=1" alt="music" /></button>
